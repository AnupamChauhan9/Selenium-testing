# Root logger configuration
status = warn
name = PropertiesConfig

# Console Appender - Logs INFO and above to the console
appender.console.type = Console
appender.console.name = Console
appender.console.layout.type = PatternLayout
appender.console.layout.pattern = "%d{yyyy-MM-dd HH:mm:ss} [%t] %-5level: %msg%n%throwable"

# File Appender - Logs ERROR to a file in test-output directory
appender.file.type = File
appender.file.name = File
appender.file.fileName = ${sys:user.dir}/test-output/application/app.log  # Log file in test-output directory
appender.file.layout.type = PatternLayout
appender.file.layout.pattern = "%d{yyyy-MM-dd HH:mm:ss} [%t] %-5level: %msg%n%throwable"

# Loggers
logger.console.name = com.example
logger.console.level = info
logger.console.appenderRef.console.ref = Console

logger.error.name = com.example
logger.error.level = error
logger.error.appenderRef.file.ref = File

# Root logger - Both Console and File appenders
rootLogger.level = info
rootLogger.appenderRef.console.ref = Console
rootLogger.appenderRef.file.ref = File
